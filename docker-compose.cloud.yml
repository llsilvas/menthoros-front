# docker-compose.cloud.yml — Perfil CLOUD
# Build multi-stage com nginx — para deploy em nuvem
# Imagem stateless: toda configuração via variáveis de ambiente
#
# Pré-requisito: rede menthoros-network criada pelo compose do backend
#
# Uso:
#   docker compose -f docker-compose.cloud.yml up --build

services:

  # ── Frontend React/Vite (nginx + assets estáticos) ───────────────────────────
  front:
    build:
      context: .
      dockerfile: docker/Dockerfile.cloud
    container_name: menthoros-front
    env_file:
      - .env
    environment:
      # /api é o padrão — nginx faz proxy reverso para menthoros-app:8099 (sem CORS)
      # Substitua por URL completa se o backend for externo à rede Docker:
      # VITE_API_BASE_URL: https://api.menthoros.com
      VITE_API_BASE_URL: /api
    ports:
      - "${FRONT_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - menthoros-network

networks:
  menthoros-network:
    external: true    # Criada pelo docker-compose.cloud.yml do backend (projeto menthoros)
